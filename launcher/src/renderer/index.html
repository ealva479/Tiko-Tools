<!doctype html>
<html><head><meta charset="utf-8"><title>Tiko Launcher</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-p2wJOWN8rB9YvERkPNjvIDxkJTxs+fOHzf3zG8iFAQc='; img-src 'self' https: data: blob: asset:; connect-src 'self' asset: blob: data:; style-src 'self' 'unsafe-inline'">
<script type="importmap">{"imports":{"three":"../../node_modules/three/build/three.module.js","three/addons/":"../../node_modules/three/examples/jsm/"}}</script>
<link rel="stylesheet" href="style.css"></head>
<body>
<aside>
  <h1>Tiko Launcher</h1>
  <button id="back" hidden>← Back to library</button>
  <h2>Sources</h2>
  <div id="sources"></div>
  <button id="addLocal">+ Add files / folders</button>
  <h2>Projects</h2>
  <div id="projects"></div>
  <button id="addProject">+ Add project</button>
  <button id="settingsBtn">Settings</button>
</aside>
<main>
  <header><input id="search" placeholder="Search your library..."><select id="source"><option value="">All sources</option></select><span id="status"></span></header>
  <div id="grid"></div>
  <div id="drop">Drop files, folders or zips to add</div>
</main>
<dialog id="settings"><form method="dialog">
  <h3>Settings</h3>
  <label>Sketchfab API token <input id="tokSketchfab" type="password" placeholder="saved (hidden)"></label>
  <label>Blender executable <span class="row"><input id="blenderPath"><button type="button" data-pick="blenderPath">Browse</button></span></label>
  <label>UnrealEditor-Cmd <span class="row"><input id="unrealEditor"><button type="button" data-pick="unrealEditor">Browse</button></span></label>
  <h3>Browser extension</h3>
  <small id="extState"></small>
  <label>Pairing token <span class="row"><input id="extToken" readonly><button type="button" id="copyTok">Copy</button></span></label>
  <small>Chrome / Edge: open chrome://extensions, turn on Developer mode, Load unpacked, choose the <b>launcher/extension</b> folder. Click its icon and paste the token.</small>
  <label>Browser downloads folder (only if not your default Downloads) <input id="extraDir" placeholder="e.g. D:\\Downloads"></label>
  <label class="check"><input id="embed" type="checkbox"> Open stores inside the launcher instead of my browser</label>
  <menu><button id="saveSettings" value="ok">Save</button><button value="cancel">Cancel</button></menu>
</form></dialog>
<script type="module" src="app.js"></script>
</body></html>
